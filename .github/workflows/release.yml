name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# One release run per tag at a time. The PyPI version guard makes a second
# run fail closed if the first one already published the version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: validate release tag
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require an exact stable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "release publishing requires a tag ref, got: $GITHUB_REF_TYPE" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match ^v[0-9]+\\.[0-9]+\\.[0-9]+$, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  build-test-and-batch:
    name: build, test, and assemble the release batch
    needs: validate-release-ref
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  chromium:
    name: compare with Chromium
    needs: validate-release-ref
    uses: ./.github/workflows/browsers.yml
    with:
      chromium-only: true
    permissions:
      contents: read

  verify-release-batch:
    name: verify tagged release batch
    needs: [build-test-and-batch, chromium]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-batch
          path: release-batch
      - name: Verify manifest, hashes, source commit, and tag version
        shell: bash
        run: |
          python .github/scripts/verify-batch.py \
            --manifest release-batch/manifest.json \
            --artifacts release-batch/artifacts \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-version "${GITHUB_REF_NAME#v}"

  publish-pypi:
    name: publish to PyPI
    needs: verify-release-batch
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject publish job reruns
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "published versions are immutable; start a new complete run from an unpublished version instead of rerunning a publish job" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-batch
          path: release-batch
      - name: Require the version to be absent from PyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if python .github/scripts/registry_state.py pypi-has browser-download-filename "$version"; then
            echo "PyPI already contains browser-download-filename $version; refusing to publish" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              echo "PyPI state query failed with status $status; refusing to publish" >&2
              exit "$status"
            fi
          fi
      # Trusted Publishing: no username or password, only an OIDC token in this
      # isolated job.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-batch/artifacts
      - name: Verify the published file set after propagation
        shell: bash
        run: |
          python .github/scripts/registry_state.py \
            pypi-set-matches browser-download-filename "${GITHUB_REF_NAME#v}" release-batch/manifest.json
